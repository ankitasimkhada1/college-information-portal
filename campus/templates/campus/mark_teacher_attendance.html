{% extends 'base.html' %}
{% block title %}Mark Teacher Attendance - ShankerDev Campus{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Mark Your Attendance</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Attendance Status:</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="present" id="present_true" value="True" checked>
                <label class="form-check-label" for="present_true">
                    Present
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="present" id="present_false" value="False">
                <label class="form-check-label" for="present_false">
                    Absent
                </label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Submit Attendance</button>
    </form>
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
</div>
{% endblock %}
